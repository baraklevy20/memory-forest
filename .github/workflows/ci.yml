# Lint, tests, packaging and the render checks on every push. The full render sweep takes
# a few minutes, so a push runs the quick one; tags and a manual run get the whole sweep.
# A change to docs/ alone runs nothing (tags always run: GitHub skips path filters for them).
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["docs/**"]
  pull_request:
    paths-ignore: ["docs/**"]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pip install ruff==0.16.8
      - run: npm install
      - run: npm run lint
      - run: npm run build

  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # the oldest Python an Anki still in use bundles, and the newest
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: npm test

  render:
    runs-on: ubuntu-24.04
    env:
      CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: npm run ${{ (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && 'render' || 'render:quick' }}
