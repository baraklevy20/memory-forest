# Lint, tests, packaging, the render checks, the phone and heatmap checks and the add-on in
# real Ankis on every push. The full render sweep takes a few minutes, so a push runs the
# quick one; tags and a manual run get the whole sweep.
# A change to docs/ alone runs nothing (tags always run: GitHub skips path filters for them).
# The checks get up to three tries (nick-fields/retry), since a slow runner can lose a click
# a second run doesn't; a retry shows as a warning on the run.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["docs/**"]
  pull_request:
    paths-ignore: ["docs/**"]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pip install ruff==0.16.8
      - run: npm install
      - run: npm run lint
      - run: npm run build

  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # the oldest Python a supported Anki bundles (2.1.45's), and the newest
        python: ["3.8", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # (the JS unit tests, tests/js: node's own runner, no packages)
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60  # v4.0.0
        with:
          max_attempts: 3
          timeout_minutes: 30
          command: npm test

  # the settings dialog itself, built on real Qt (offscreen) and driven as a user drives it
  # (tests/test_settings_dialog*.py): `npm test` skips those where PyQt6 isn't installed, as in the
  # job above. Qt's offscreen platform still needs a few of the system's libraries
  settings-dialog:
    name: Settings dialog (Qt)
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
      FOREST_QT_TESTS: required
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install PyQt6==6.11.0
      - uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60  # v4.0.0
        with:
          max_attempts: 3
          timeout_minutes: 30
          command: python3 -m unittest discover -s tests -p 'test_settings_dialog*.py' -v

  # the render checks, and the phone, heatmap, page, Onigiri and layout checks (e2e/phone_check.py,
  # e2e/heatmap_check.py, e2e/page_check.py, e2e/onigiri_check.py, e2e/layout_check.py),
  # which drive the runner's Chrome through node: `npm test` runs those only when their files
  # changed, which a fresh checkout cannot tell, so here they always run
  render:
    runs-on: ubuntu-24.04
    env:
      CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60  # v4.0.0
        with:
          max_attempts: 3
          timeout_minutes: 60
          command: npm run ${{ (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && 'render' || 'render:quick' }}
      - uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60  # v4.0.0
        with:
          max_attempts: 3
          timeout_minutes: 30
          command: npm run test:phone
      - uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60  # v4.0.0
        with:
          max_attempts: 3
          timeout_minutes: 30
          command: npm run test:heatmap
      - uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60  # v4.0.0
        with:
          max_attempts: 3
          timeout_minutes: 30
          command: npm run test:page
      - uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60  # v4.0.0
        with:
          max_attempts: 3
          timeout_minutes: 30
          command: npm run test:onigiri
      - uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60  # v4.0.0
        with:
          max_attempts: 3
          timeout_minutes: 30
          command: npm run test:layout

  # the Ankis a release is checked in, the oldest supported to the newest: e2e/old_anki.py's
  # RELEASE_ANKIS, read here so the two never part
  anki-versions:
    name: Anki versions
    runs-on: ubuntu-24.04
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: echo "list=$(python3 -c 'import json, sys; sys.path.insert(0, "e2e"); import old_anki; print(json.dumps(old_anki.RELEASE_ANKIS))')" >> "$GITHUB_OUTPUT"

  # the add-on, built as it ships, run by itself in each of those Ankis (e2e/old_anki.py
  # --check): the macOS builds, downloaded from Anki's releases and kept in the cache; the
  # Intel-only ones (before 2.1.50, and the Qt5 builds) run under Rosetta
  anki:
    name: Anki ${{ matrix.anki }}
    needs: anki-versions
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        anki: ${{ fromJSON(needs.anki-versions.outputs.list) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - name: Rosetta, for the Intel-only Ankis
        run: /usr/bin/pgrep -q oahd || sudo softwareupdate --install-rosetta --agree-to-license
      - uses: actions/cache@v6
        with:
          path: ~/Library/Caches/memory-forest/anki/${{ matrix.anki }}.app
          key: anki-${{ matrix.anki }}
      - uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60  # v4.0.0
        with:
          max_attempts: 3
          timeout_minutes: 30
          command: python3 e2e/old_anki.py --check ${{ matrix.anki }}
      - id: results
        if: always()
        run: echo "dir=$(python3 -c 'import os, tempfile; print(os.path.join(tempfile.gettempdir(), "memory-forest-old-anki"))')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: anki-${{ matrix.anki }}
          path: ${{ steps.results.outputs.dir }}
          if-no-files-found: ignore
